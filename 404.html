<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada - WikiGames</title>
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            try {
                const basePath = (window.location.hostname.endsWith('github.io') && window.location.pathname.split('/').filter(Boolean)[0])
                    ? '/' + window.location.pathname.split('/').filter(Boolean)[0]
                    : '';
                const rawPath = window.location.pathname || '/';
                const route = rawPath
                    .replace(new RegExp('^' + basePath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '/?'), '')
                    .replace(/^\/+|\/+$/g, '')
                    .replace(/index\.html$/, '')
                    .replace(/^\?/, '');

                const target = route && route !== '' ? (basePath || '') + '/?route=' + encodeURIComponent(route) : (basePath || '') + '/';
                setTimeout(function() {
                    window.location.replace(target);
                }, 3000);
            } catch (error) {
                setTimeout(function() {
                    window.location.replace((window.location.origin + (window.location.pathname.includes('/wiki-games') ? '/wiki-games' : '')) || '/');
                }, 3000);
            }
        })();
    </script>
</head>
<body class="error-page">
    <main>
        <h1>404</h1>
        <h2>Caminho Não Encontrado</h2>
    <p>Você será redirecionado para a Wiki em 3 segundos...</p>
        <p>Se não for redirecionado, <a href="/">clique aqui</a>.</p>
    </main>
</body>
</html>
