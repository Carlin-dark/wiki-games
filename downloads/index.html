<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171a16">
    <meta name="description" id="page-description" content="Links oficiais, downloads autorizados e instruções de instalação de jogos na WikiGames.">
    <meta name="robots" id="page-robots" content="index,follow">
    <title>Downloads - WikiGames</title>
    <link rel="canonical" id="page-canonical" href="">
    <link rel="icon" id="page-favicon" href="../favicon.ico.jpg">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WikiGames">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" id="og-title" content="Downloads - WikiGames">
    <meta property="og:description" id="og-description" content="Links oficiais, downloads autorizados e instruções de instalação de jogos na WikiGames.">
    <meta property="og:url" id="og-url" content="">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:image:alt" id="og-image-alt" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitter-title" content="Downloads - WikiGames">
    <meta name="twitter:description" id="twitter-description" content="Links oficiais, downloads autorizados e instruções de instalação de jogos na WikiGames.">
    <meta name="twitter:image" id="twitter-image" content="">
    <script type="application/ld+json" id="page-structured-data"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
            --page: #171a16;
            --surface: #222720;
            --surface-raised: #2a3028;
            --text: #f0f1e9;
            --muted: #b0b7a9;
            --line: #444c40;
            --accent: #c9ef74;
            --accent-ink: #1c2611;
            --warm: #e6a980;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background-color: var(--page);
            background-image: repeating-linear-gradient(135deg, transparent 0 34px, rgb(255 255 255 / 2%) 35px 36px);
            font-family: "DM Sans", sans-serif;
            line-height: 1.6;
        }
        a { color: inherit; }
        
        /* Layout principal modificado para suportar a barra lateral (Sidebar) */
        .page { 
            width: min(1240px, calc(100% - 36px)); 
            margin: 0 auto; 
            padding: 28px 0 64px; 
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 32px;
            align-items: start;
        }
        
        .main-content {
            grid-column: 1;
            min-width: 0;
        }

        .sidebar {
            grid-column: 2;
            position: sticky;
            top: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .ad-banner-box {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
        .brand { color: var(--accent); font: 700 18px "Space Grotesk", sans-serif; text-decoration: none; }
        .back-link { color: var(--muted); font-size: 14px; text-decoration-thickness: 1px; text-underline-offset: 4px; }
        .back-link:hover { color: var(--text); }
        .hero { display: grid; grid-template-columns: 1fr minmax(180px, 280px); gap: 32px; align-items: center; padding: 44px 0 34px; }
        .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; }
        h1, h2, h3 { font-family: "Space Grotesk", sans-serif; line-height: 1.2; }
        h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); }
        .summary { max-width: 620px; margin: 14px 0 0; color: var(--muted); }
        .cover { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
        .section { padding: 26px 0; border-top: 1px solid var(--line); }
        .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
        h2 { margin: 0; font-size: 23px; }
        .section-note { margin: 0; color: var(--muted); font-size: 13px; }
        .link-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
        .download-link { display: flex; min-height: 72px; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; text-decoration: none; transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease; }
        .download-link:hover { background: var(--surface-raised); border-color: var(--accent); transform: translateY(-2px); }
        .download-link strong { display: block; font-size: 15px; }
        .verified-badge { margin-left: 7px; color: #0095f6; font-size: 15px; vertical-align: middle; }
        .download-link small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
        .download-link .arrow { flex: 0 0 auto; color: var(--accent); font-size: 20px; }
        .steps { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: install-step; }
        .steps li { position: relative; min-height: 44px; padding: 9px 12px 9px 48px; color: var(--muted); background: rgb(34 39 32 / 78%); border-left: 2px solid var(--warm); counter-increment: install-step; }
        .steps li::before { position: absolute; left: 15px; color: var(--warm); font: 700 14px "Space Grotesk", sans-serif; content: counter(install-step, decimal-leading-zero); }
        .notice { margin: 24px 0 0; padding: 12px 14px; color: var(--muted); background: rgb(230 169 128 / 8%); border-left: 3px solid var(--warm); font-size: 13px; }
        .empty-state { margin: 38px 0; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; }
        .empty-state h1 { font-size: 30px; }
        .empty-state p { color: var(--muted); }
        footer { grid-column: 1 / -1; padding-top: 20px; color: var(--muted); border-top: 1px solid var(--line); font-size: 12px; }

        @media (max-width: 900px) {
            .page { 
                grid-template-columns: 1fr; 
                width: min(100% - 28px, 940px); 
                padding-top: 18px; 
            }
            .sidebar {
                grid-column: 1;
                position: static;
            }
            .hero { grid-template-columns: 1fr; gap: 20px; padding-top: 30px; }
            .cover { max-width: 420px; }
            .section-heading { align-items: flex-start; flex-direction: column; gap: 4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="page" id="downloads-page" aria-live="polite">
        <!-- Conteúdo Principal -->
        <div class="main-content">
            <header class="topbar">
                <a class="brand" href="../">WikiGames</a>
                <a class="back-link" id="back-link" href="../">Voltar ao jogo</a>
            </header>
            <div id="downloads-content"></div>
        </div>

        <!-- Barra Lateral com o Banner de Anúncio -->
        <aside class="sidebar">
            <div class="ad-banner-box" id="sidebar-ad-container">
                <!-- O script do anúncio será inserido aqui -->
            </div>
        </aside>

        <footer>WikiGames · Consulte as páginas oficiais e os requisitos antes de instalar.</footer>
    </main>

    <script src="../articles.js"></script>
    <script>
        (function () {
            const content = document.getElementById('downloads-content');
            const gameKey = new URLSearchParams(window.location.search).get('game');
            const database = typeof articlesDatabase !== 'undefined' ? articlesDatabase : {};
            const game = gameKey ? database[gameKey] : null;

            function escapeHtml(value) {
                return String(value ?? '').replace(/[&<>"']/g, character => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[character]);
            }

            function safeUrl(value) {
                try {
                    const url = new URL(value);
                    const hostname = url.hostname.toLowerCase();
                    const isPlaceholder = hostname === 'example.com' || hostname.endsWith('.example') || hostname.endsWith('.invalid');
                    return ['http:', 'https:'].includes(url.protocol) && !isPlaceholder ? url.href : '';
                } catch (error) {
                    return '';
                }
            }

            function mergeLinks(...groups) {
                const seen = new Set();
                return groups.flatMap(group => Array.isArray(group) ? group : []).filter(item => {
                    const url = item && safeUrl(item.url);
                    if (!url || seen.has(url)) return false;
                    seen.add(url);
                    return true;
                });
            }

            function discoverOfficialLinks(...articles) {
                const trustedDomains = ['store.steampowered.com', 'itch.io', 'gog.com', 'microsoft.com', 'playstation.com', 'nintendo.com', 'xbox.com', 'epicgames.com'];
                const officialLinks = [];
                const files = [];
                const seen = new Set();

                articles.forEach(article => {
                    if (!article) return;
                    const articleDocument = new DOMParser().parseFromString(article.content || '', 'text/html');
                    articleDocument.querySelectorAll('a[href]').forEach(link => {
                        const url = safeUrl(link.getAttribute('href'));
                        if (!url || seen.has(url)) return;
                        const hostname = new URL(url).hostname.toLowerCase();
                        if (!trustedDomains.some(domain => hostname === domain || hostname.endsWith(`.${domain}`))) return;
                        seen.add(url);
                        const item = { label: link.textContent.trim() || hostname, url };
                        if (/download|baixar/i.test(item.label)) files.push(item);
                        else officialLinks.push(item);
                    });
                });

                return { officialLinks, files };
            }

            function renderLinks(items, emptyMessage) {
                const validItems = (Array.isArray(items) ? items : []).filter(item => item && safeUrl(item.url));
                if (!validItems.length) return `<p class="section-note">${escapeHtml(emptyMessage)}</p>`;
                return `<div class="link-list">${validItems.map(item => `
                    <a class="download-link" href="${escapeHtml(safeUrl(item.url))}" target="_blank" rel="noopener noreferrer">
                        <span><strong>${escapeHtml(item.label || 'Abrir link')}${item.verified === true ? '<i class="fa-solid fa-circle-check verified-badge" role="img" aria-label="Link verificado" title="Link verificado"></i>' : ''}</strong>${item.details ? `<small>${escapeHtml(item.details)}</small>` : ''}</span>
                        <span class="arrow" aria-hidden="true">↗</span>
                    </a>
                `).join('')}</div>`;
            }

            function setMeta(selector, value) {
                const element = document.querySelector(selector);
                if (element) element.setAttribute('content', value || '');
            }

            function updatePageMetadata({ title, description, url, image, imageAlt, robots = 'index,follow', structuredData }) {
                document.title = title;
                setMeta('#page-description', description);
                setMeta('#page-robots', robots);
                setMeta('#og-title', title);
                setMeta('#og-description', description);
                setMeta('#og-url', url);
                setMeta('#og-image', image);
                setMeta('#og-image-alt', imageAlt);
                setMeta('#twitter-title', title);
                setMeta('#twitter-description', description);
                setMeta('#twitter-image', image);

                const canonical = document.getElementById('page-canonical');
                if (canonical) canonical.href = url;

                if (image) {
                    const favicon = document.getElementById('page-favicon');
                    if (favicon) favicon.href = image;
                }

                const structuredDataElement = document.getElementById('page-structured-data');
                if (structuredDataElement && structuredData) {
                    structuredDataElement.textContent = JSON.stringify(structuredData);
                }
            }

            if (!game) {
                const missingTitle = 'Jogo não encontrado - WikiGames';
                const missingDescription = 'O jogo solicitado não foi encontrado no catálogo da WikiGames.';
                updatePageMetadata({
                    title: missingTitle,
                    description: missingDescription,
                    url: window.location.href,
                    image: '',
                    imageAlt: '',
                    robots: 'noindex,follow'
                });
                content.innerHTML = `
                    <section class="empty-state">
                        <p class="eyebrow">Downloads</p>
                        <h1>Jogo não encontrado</h1>
                        <p>Confira o endereço ou volte ao catálogo da WikiGames.</p>
                        <a class="back-link" href="../">Ir para a página inicial</a>
                    </section>
                `;
                return;
            }

            const configuredDownloads = game.downloads || {};
            const discoveredDownloads = discoverOfficialLinks(game);
            const downloads = {
                officialLinks: mergeLinks(configuredDownloads.officialLinks, discoveredDownloads.officialLinks),
                files: mergeLinks(configuredDownloads.files, discoveredDownloads.files),
                installation: configuredDownloads.installation || {
                    title: 'Orientações de instalação',
                    steps: [
                        'Acesse uma das páginas oficiais indicadas e escolha a edição compatível com seu dispositivo.',
                        'Instale ou execute o jogo seguindo as instruções da loja ou do desenvolvedor.',
                        'Para traduções e patches, consulte a documentação do projeto responsável e confirme a compatibilidade com sua versão.'
                    ]
                }
            };
            const installation = downloads.installation;
            const imageUrl = safeUrl(game.infobox?.image);
            const steps = Array.isArray(installation.steps) ? installation.steps : [];
            const backLink = document.getElementById('back-link');
            backLink.href = `../?route=${encodeURIComponent(gameKey)}`;

            const pageTitle = `Downloads de ${game.title} | WikiGames`;
            const pageDescription = `Links oficiais, downloads autorizados e instruções de instalação de ${game.title}. ${game.summary || ''}`.trim();
            const canonicalUrl = new URL(window.location.pathname, window.location.origin);
            canonicalUrl.searchParams.set('game', gameKey);
            updatePageMetadata({
                title: pageTitle,
                description: pageDescription,
                url: canonicalUrl.href,
                image: imageUrl,
                imageAlt: `Capa de ${game.title}`,
                structuredData: {
                    '@context': 'https://schema.org',
                    '@type': 'WebPage',
                    name: pageTitle,
                    description: pageDescription,
                    url: canonicalUrl.href,
                    ...(imageUrl ? { primaryImageOfPage: { '@type': 'ImageObject', url: imageUrl } } : {}),
                    about: {
                        '@type': 'VideoGame',
                        name: game.title,
                        description: game.summary || '',
                        ...(imageUrl ? { image: imageUrl } : {}),
                        ...(Array.isArray(game.categories) && game.categories.length ? { genre: game.categories } : {})
                    }
                }
            });
            content.innerHTML = `
                <section class="hero">
                    <div>
                        <p class="eyebrow">Downloads do jogo</p>
                        <h1>${escapeHtml(game.title)}</h1>
                        <p class="summary">${escapeHtml(game.summary || '')}</p>
                    </div>
                    ${imageUrl ? `<img class="cover" src="${escapeHtml(imageUrl)}" alt="Capa de ${escapeHtml(game.title)}">` : ''}
                </section>
                <section class="section">
                    <div class="section-heading"><h2>Links oficiais</h2><p class="section-note">Páginas e lojas do jogo</p></div>
                    ${renderLinks(downloads.officialLinks, 'Nenhum link oficial foi cadastrado.')}
                </section>
                <section class="section">
                    <div class="section-heading"><h2>Downloads</h2><p class="section-note">Escolha uma opção disponível</p></div>
                    ${renderLinks(downloads.files, 'Nenhum download direto autorizado foi cadastrado; use as páginas oficiais acima.')}
                </section>
                <section class="section">
                    <div class="section-heading"><h2>${escapeHtml(installation.title || 'Como instalar')}</h2></div>
                    ${steps.length ? `<ol class="steps">${steps.map(step => `<li>${escapeHtml(step)}</li>`).join('')}</ol>` : '<p class="section-note">As instruções de instalação ainda não foram cadastradas.</p>'}
                </section>
                <p class="notice">Os links são fornecidos pelas fontes indicadas em cada opção. Verifique a origem dos arquivos e siga as instruções oficiais do jogo.</p>
            `;
        })();
    </script>

    <!-- Script do Banner de Anúncio Posicionado na Lateral -->
    <script>
        (function(s){
            s.dataset.zone = '12254528';
            s.src = 'https://n6wxm.com/vignette.min.js';
            const container = document.getElementById('sidebar-ad-container');
            if (container) {
                container.appendChild(s);
            } else {
                document.body.appendChild(s);
            }
        })(document.createElement('script'));
    </script>
</body>
</html>
